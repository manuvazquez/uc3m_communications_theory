[project]
name = "communications-theory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "ipywidgets",
    "librosa",
    "pandas",
    "plotly",
    "standard-aifc",
]

[tool.setuptools]
include-package-data = true
package-dir = {"" = "."}
packages = ["communications_theory"]

[tool.setuptools.package-data]
communications_theory = ["data/*"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "jupyterlab>=4.3.6",
]
